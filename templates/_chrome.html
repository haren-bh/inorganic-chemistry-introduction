  <!-- Retractable Left Sidebar Navigation -->
  <aside class="site-sidebar" id="site-sidebar" aria-label="Application Sidebar Navigation">
    <div class="sidebar-top">
      <a class="sidebar-brand" href="{{ url_for('index') }}" title="AP Chemistry Home" aria-label="AP Chemistry Home">
        <svg class="sidebar-atom-svg" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
          <!-- 3 Intersecting Elliptical Electron Orbits -->
          <ellipse cx="32" cy="32" rx="27" ry="10.5" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.85"/>
          <ellipse cx="32" cy="32" rx="27" ry="10.5" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.85" transform="rotate(60 32 32)"/>
          <ellipse cx="32" cy="32" rx="27" ry="10.5" fill="none" stroke="currentColor" stroke-width="2.2" opacity="0.85" transform="rotate(120 32 32)"/>
          <!-- Central Atomic Nucleus (Proton + Neutron Cluster) -->
          <circle cx="30" cy="30" r="3.6" fill="#111827"/>
          <circle cx="34.5" cy="30.5" r="3.4" fill="#4b5563"/>
          <circle cx="31.5" cy="34.5" r="3.4" fill="#374151"/>
          <circle cx="32" cy="31.8" r="2.2" fill="#ffffff" opacity="0.45"/>
          <!-- Orbiting Electrons -->
          <circle cx="59" cy="32" r="2.8" fill="#111827"/>
          <circle cx="18.5" cy="8.6" r="2.8" fill="#111827"/>
          <circle cx="18.5" cy="55.4" r="2.8" fill="#111827"/>
        </svg>
      </a>
      <button
        type="button"
        class="sidebar-toggle-btn"
        id="btn-toggle-sidebar"
        aria-label="Retract or expand navigation sidebar"
        aria-expanded="true"
        title="Retract / Expand Sidebar (Ctrl+B)"
      >
        <span class="sidebar-toggle-icon" aria-hidden="true">«</span>
      </button>
    </div>

    <nav class="page-nav" aria-label="Sections">
      <!-- Main Group 1: Chemistry Topics -->
      <details class="sidebar-nav-group" id="sidebar-group-topics" open>
        <summary class="sidebar-group-summary {{ 'is-active-group' if request.endpoint in ('index', 'orbitals', 'reactions') else '' }}" title="Chemistry Topics">
          <span class="nav-link-badge" aria-hidden="true">⚗</span>
          <span class="nav-link-label">Chemistry Topics</span>
          <span class="sidebar-group-chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="sidebar-submenu">
          <a
            href="{{ url_for('index') }}"
            class="nav-link sidebar-sublink {{ 'active' if request.endpoint == 'index' else '' }}"
            {% if request.endpoint == 'index' %}aria-current="page"{% endif %}
            title="01 · Rutherford &amp; Thomson Experiments"
          >
            <span class="nav-link-badge" aria-hidden="true">01</span>
            <span class="nav-link-label">Rutherford &amp; Thomson Experiments</span>
          </a>
          <a
            href="{{ url_for('orbitals') }}"
            class="nav-link sidebar-sublink {{ 'active' if request.endpoint == 'orbitals' else '' }}"
            {% if request.endpoint == 'orbitals' %}aria-current="page"{% endif %}
            title="02 · Atomic Orbitals &amp; Quantum Mechanics"
          >
            <span class="nav-link-badge" aria-hidden="true">02</span>
            <span class="nav-link-label">Atomic Orbitals &amp; Quantum Mechanics</span>
          </a>
          <a
            href="{{ url_for('reactions') }}"
            class="nav-link sidebar-sublink {{ 'active' if request.endpoint == 'reactions' else '' }}"
            {% if request.endpoint == 'reactions' %}aria-current="page"{% endif %}
            title="03 · Essential Chemical Reactions"
          >
            <span class="nav-link-badge" aria-hidden="true">03</span>
            <span class="nav-link-label">Essential Chemical Reactions</span>
          </a>
        </div>
      </details>

      <!-- Main Group 2: AP Chemistry Quiz (with Units 1–9 Submenu) -->
      <details class="sidebar-nav-group" id="sidebar-group-quiz" open>
        <summary class="sidebar-group-summary {{ 'is-active-group' if request.endpoint == 'quiz' else '' }}" title="AP Chemistry Quiz (Units 1–9)">
          <span class="nav-link-badge" aria-hidden="true">04</span>
          <span class="nav-link-label">AP Chemistry Quiz</span>
          <span class="sidebar-group-chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="sidebar-submenu" id="quiz-unit-sidebar">
          {% for u in nav_units %}
          <a
            href="{{ ('#/unit/' ~ u.id) if request.endpoint == 'quiz' else (url_for('quiz') ~ '?unit=' ~ u.id) }}"
            class="nav-link sidebar-sublink quiz-unit-btn"
            data-unit="{{ u.id }}"
            title="{{ u.title }} (Exam Weight: {{ u.exam_weight }} • {{ u.question_count }} Questions)"
          >
            <span class="nav-link-badge unit-sub-badge" aria-hidden="true">U{{ u.id }}</span>
            <span class="nav-link-label">{{ u.title }}</span>
            <span class="unit-sub-stat" data-unit-stat="{{ u.id }}">{{ u.question_count }} Qs</span>
          </a>
          {% endfor %}
        </div>
      </details>

      <!-- Main Item 3: Performance Dashboard -->
      <a
        href="{{ url_for('dashboard') }}"
        class="nav-link sidebar-top-link {{ 'active' if request.endpoint == 'dashboard' else '' }}"
        {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}
        title="05 · Performance &amp; Attempt Analytics Dashboard"
      >
        <span class="nav-link-badge" aria-hidden="true">05</span>
        <span class="nav-link-label">Performance Dashboard</span>
      </a>
    </nav>

    <div class="sidebar-footer" id="sidebar-user-mount"></div>
  </aside>

  <!-- Compact Top Header (<= 10% viewport height) with "AP Chemistry" Title & Lab Apparatus SVGs -->

    <div class="header-inner">
      <a class="header-app-title" href="{{ url_for('index') }}">
        <svg class="header-title-atom-svg" viewBox="0 0 36 36" width="24" height="24" aria-hidden="true">

          <ellipse cx="18" cy="18" rx="15" ry="6" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(60 18 18)"/>
          <ellipse cx="18" cy="18" rx="15" ry="6" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(120 18 18)"/>
          <circle cx="18" cy="18" r="3.2" fill="currentColor"/>
        </svg>
        <span>AP Chemistry</span>
      </a>

            <circle cx="12" cy="6.2" r="1.7" fill="currentColor"/>

        </span>

        <!-- 8. Test Tube Rack -->
